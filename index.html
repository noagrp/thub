<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="T.HUB"><title>T.HUB</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{color-scheme:dark;--line:#292929;--muted:#888;--panel:#090909}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Courier New",monospace}button,input,select{font:inherit}button{color:inherit}.hidden{display:none!important}#login{min-height:100dvh;display:grid;place-items:center;padding:24px}.login-box{width:min(300px,100%)}.brand{text-align:center;letter-spacing:.28em;font-weight:700;margin:0 0 22px}.login-box input,.login-box button{width:100%;height:46px;background:#000;color:#fff;border:1px solid #3a3a3a;border-radius:6px;text-align:center}.login-box button{margin-top:8px;cursor:pointer}
#app{min-height:100dvh}.menu-btn{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:30;width:44px;height:44px;border:1px solid #555;border-radius:7px;background:rgba(0,0,0,.84);font-size:22px;cursor:pointer}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:38;opacity:0;pointer-events:none;transition:.18s}.backdrop.open{opacity:1;pointer-events:auto}.drawer{position:fixed;z-index:40;inset:0 auto 0 0;width:min(410px,94vw);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-101%);transition:transform .18s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}.drawer.open{transform:none}.drawer-head{padding:14px;border-bottom:1px solid var(--line)}.drawer-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.drawer-title strong{letter-spacing:.16em}.close-btn{width:38px;height:38px;border:0;background:transparent;font-size:24px}.search{width:100%;height:43px;border:1px solid #3a3a3a;border-radius:5px;background:#000;color:#fff;padding:0 12px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.filters select{min-width:0;height:40px;border:1px solid #333;border-radius:5px;background:#101010;color:#ddd;padding:0 7px}.tabs{display:flex;gap:6px;margin-top:8px;overflow:auto}.tab{border:1px solid #333;border-radius:999px;background:#0b0b0b;padding:7px 10px;font-size:12px;white-space:nowrap}.tab.active{background:#fff;color:#000}.scanbox{margin-top:9px;padding:9px;border:1px solid #252525;border-radius:5px;background:#050505}.scanline{font-size:10px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scanbuttons{display:flex;gap:6px;margin-top:7px}.scanbuttons button{flex:1;height:31px;border:1px solid #333;border-radius:4px;background:#101010;font-size:10px}.scanbuttons .danger{color:#aaa}.count{font-size:11px;color:var(--muted);margin-top:9px}.channel-scroll{overflow:auto;flex:1}.channel{min-height:54px;border-bottom:1px solid #202020;display:flex;align-items:center;gap:7px;padding:7px 8px 7px 14px;cursor:pointer}.channel:hover{background:#141414}.channel-info{min-width:0;flex:1}.channel-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel-meta{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.testmark{font-size:11px;min-width:18px;text-align:center}.testmark.ok{color:#fff}.testmark.bad{color:#666}.star{flex:0 0 38px;height:40px;border:0;background:transparent;color:#aaa;font-size:21px}.star.on{color:#fff}.more{display:block;width:calc(100% - 24px);height:42px;margin:12px;border:1px solid #333;border-radius:5px;background:#111}.empty{padding:30px 15px;text-align:center;color:#777;font-size:12px}.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:72px 18px 42px}.player-shell{width:min(1100px,100%)}.video-wrap{position:relative;width:100%;background:#050505;border:1px solid #171717;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}video{display:block;width:100%;height:100%;background:#000;object-fit:contain}.status{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.74);padding:6px 9px;border-radius:4px;font-size:11px}.status:empty{display:none}.now{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 2px;color:#aaa;font-size:12px}.now-name{color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.retry{margin-left:auto;border:1px solid #333;background:#0c0c0c;border-radius:4px;padding:6px 9px}.scan-float{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:20;padding:6px 9px;border:1px solid #252525;border-radius:5px;background:rgba(0,0,0,.82);font-size:10px;color:#aaa;pointer-events:none}@media(max-width:640px){.stage{min-height:100dvh;align-items:flex-start;padding:78px 0 24px}.video-wrap{border-left:0;border-right:0}.now{padding:8px 12px}.drawer{width:95vw}}
</style></head><body>
<div id="login"><div class="login-box"><div class="brand">T.HUB</div><input type="password" id="pass" placeholder="PASSWORD" autocomplete="current-password"><button id="accessBtn">ACCESS</button></div></div>
<div id="app" class="hidden"><button id="menuBtn" class="menu-btn">☰</button><div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer"><div class="drawer-head"><div class="drawer-title"><strong>CHANNELS</strong><button id="closeBtn" class="close-btn">×</button></div><input id="search" class="search" type="search" placeholder="Search all channels…"><div class="filters"><select id="country"><option value="">All countries</option></select><select id="language"><option value="">All languages</option></select></div><div class="tabs"><button class="tab active" data-mode="all">ALL</button><button id="workingTab" class="tab" data-mode="working">✓ WORKING</button><button id="untestedTab" class="tab" data-mode="untested">? UNTESTED</button><button id="favTab" class="tab" data-mode="favorites">★ FAVORITES (0)</button><button id="recentTab" class="tab" data-mode="recent">RECENT (0)</button></div><div class="scanbox"><div id="scanLine" class="scanline">TEST: ready</div><div class="scanbuttons"><button id="scanBtn">START TEST</button><button id="clearScan" class="danger">CLEAR</button></div></div><div id="count" class="count">Loading directory…</div></div><div class="channel-scroll"><div id="items"></div></div></aside><main class="stage"><div class="player-shell"><div class="video-wrap"><video id="player" controls playsinline></video><div id="status" class="status">Choose a channel from ☰</div></div><div class="now"><span id="nowName" class="now-name">No channel selected</span><button id="retry" class="retry hidden">RETRY</button></div></div></main><div id="scanFloat" class="scan-float hidden"></div></div>
<script>
const PASSWORD_HASH='2aa0f2f2ea687f2967eb4ad39b5112d81ea142aead768c245ac8a98517a032da',API='https://iptv-org.github.io/api/',PAGE_SIZE=100,TEST_TIMEOUT=7000,$=id=>document.getElementById(id),player=$('player');
let allChannels=[],filtered=[],visibleCount=PAGE_SIZE,mode='all',hls=null,current=null,retries=0,fetchStarted=false,scanRunning=false,scanStop=false;
let favorites=new Set(readJSON('thub-favorites',[])),recent=readJSON('thub-recent',[]),tests=readJSON('thub-tests',{});
function readJSON(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}async function sha256(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function unlock(){$('login').classList.add('hidden');$('app').classList.remove('hidden');if(!fetchStarted)fetchAll()}async function checkPass(){if(await sha256($('pass').value)===PASSWORD_HASH){sessionStorage.setItem('thub-auth','1');unlock()}else{$('pass').value='';alert('ACCESS DENIED')}}$('accessBtn').onclick=checkPass;$('pass').onkeydown=e=>{if(e.key==='Enter')checkPass()};if(sessionStorage.getItem('thub-auth')==='1')unlock();
async function getJSON(f){const r=await fetch(API+f,{cache:'default'});if(!r.ok)throw Error(f);return r.json()}
async function fetchAll(){fetchStarted=true;try{const [channels,feeds,streams,countries,languages]=await Promise.all([getJSON('channels.json'),getJSON('feeds.json'),getJSON('streams.json'),getJSON('countries.json'),getJSON('languages.json')]);const cMap=new Map(channels.map(c=>[c.id,c])),fMap=new Map(feeds.map(f=>[`${f.channel}|${f.id||''}`,f])),countryMap=new Map(countries.map(c=>[c.code,c])),langMap=new Map(languages.map(l=>[l.code,l.name]));allChannels=streams.filter(s=>/^https?:\/\//i.test(s.url||'')).map(s=>{const ch=cMap.get(s.channel)||{},feed=fMap.get(`${s.channel}|${s.feed||''}`)||{},co=countryMap.get(ch.country)||{};let langs=feed.languages||[];if(!langs.length&&co.languages?.length===1)langs=co.languages;return{id:s.url,name:ch.name||s.title||'Unknown channel',url:s.url,country:ch.country||'',countryName:co.name||ch.country||'',flag:co.flag||'',languages:langs,languageNames:langs.map(x=>langMap.get(x)||x),quality:s.quality||'',label:s.label||''}});buildFilters(countryMap,langMap);updateUI();applyFilters()}catch(e){$('count').textContent='Could not load directory';$('items').innerHTML='<div class="empty">Directory unavailable.</div>'}}
function buildFilters(cm,lm){const cs=[...new Set(allChannels.map(c=>c.country).filter(Boolean))].sort((a,b)=>(cm.get(a)?.name||a).localeCompare(cm.get(b)?.name||b));$('country').innerHTML='<option value="">All countries</option>'+cs.map(x=>`<option value="${esc(x)}">${esc((cm.get(x)?.flag||'')+' '+(cm.get(x)?.name||x))}</option>`).join('');const ls=[...new Set(allChannels.flatMap(c=>c.languages))].sort((a,b)=>(lm.get(a)||a).localeCompare(lm.get(b)||b));$('language').innerHTML='<option value="">All languages</option>'+ls.map(x=>`<option value="${esc(x)}">${esc(lm.get(x)||x)}</option>`).join('')}
function counts(){let ok=0,bad=0;for(const v of Object.values(tests)){if(v.status==='ok')ok++;else if(v.status==='bad')bad++}return{ok,bad,tested:ok+bad}}
function updateUI(){const c=counts();$('favTab').textContent=`★ FAVORITES (${favorites.size})`;$('recentTab').textContent=`RECENT (${recent.length})`;$('workingTab').textContent=`✓ WORKING (${c.ok})`;$('untestedTab').textContent=`? UNTESTED (${Math.max(0,allChannels.length-c.tested)})`;$('scanLine').textContent=`TEST: ${c.tested.toLocaleString()} / ${allChannels.length.toLocaleString()} · ✓ ${c.ok.toLocaleString()} · × ${c.bad.toLocaleString()}`;$('scanBtn').textContent=scanRunning?'PAUSE TEST':(c.tested?'RESUME TEST':'START TEST');$('scanFloat').textContent=`TEST ${c.tested.toLocaleString()}/${allChannels.length.toLocaleString()} · ✓${c.ok} ×${c.bad}`;$('scanFloat').classList.toggle('hidden',!scanRunning)}
function applyFilters(){const q=$('search').value.trim().toLowerCase(),co=$('country').value,la=$('language').value;let list=allChannels;if(mode==='favorites')list=list.filter(c=>favorites.has(c.id));if(mode==='recent'){const o=new Map(recent.map((id,i)=>[id,i]));list=list.filter(c=>o.has(c.id)).sort((a,b)=>o.get(a.id)-o.get(b.id))}if(mode==='working')list=list.filter(c=>tests[c.id]?.status==='ok');if(mode==='untested')list=list.filter(c=>!tests[c.id]);filtered=list.filter(c=>(!q||`${c.name} ${c.countryName} ${c.languageNames.join(' ')}`.toLowerCase().includes(q))&&(!co||c.country===co)&&(!la||c.languages.includes(la)));visibleCount=PAGE_SIZE;render()}
function render(){const shown=filtered.slice(0,visibleCount);$('count').textContent=`${filtered.length.toLocaleString()} channels · showing ${shown.length.toLocaleString()}`;if(!shown.length){$('items').innerHTML='<div class="empty">No channels found.</div>';return}$('items').innerHTML=shown.map(c=>{const t=tests[c.id],mark=t?.status==='ok'?'<span class="testmark ok">✓</span>':t?.status==='bad'?'<span class="testmark bad">×</span>':'<span class="testmark">?</span>';return`<div class="channel" data-id="${esc(c.id)}">${mark}<div class="channel-info"><div class="channel-name">${esc(c.name)}</div><div class="channel-meta">${esc([c.flag&&c.countryName,c.languageNames.join(', '),c.quality,c.label].filter(Boolean).join(' · ')||'Live stream')}</div></div><button class="star ${favorites.has(c.id)?'on':''}" data-star="${esc(c.id)}">${favorites.has(c.id)?'★':'☆'}</button></div>`}).join('')+(visibleCount<filtered.length?'<button id="moreBtn" class="more">SHOW 100 MORE</button>':'');$('moreBtn')?.addEventListener('click',()=>{visibleCount+=PAGE_SIZE;render()})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('items').onclick=e=>{const star=e.target.closest('[data-star]');if(star){e.stopPropagation();favorites.has(star.dataset.star)?favorites.delete(star.dataset.star):favorites.add(star.dataset.star);saveJSON('thub-favorites',[...favorites]);updateUI();render();return}const row=e.target.closest('.channel');if(row){const c=allChannels.find(x=>x.id===row.dataset.id);if(c)playChannel(c)}};$('search').oninput=applyFilters;$('country').onchange=applyFilters;$('language').onchange=applyFilters;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;applyFilters()});
function openDrawer(){$('drawer').classList.add('open');$('backdrop').classList.add('open')}function closeDrawer(){$('drawer').classList.remove('open');$('backdrop').classList.remove('open')}$('menuBtn').onclick=openDrawer;$('closeBtn').onclick=closeDrawer;$('backdrop').onclick=closeDrawer;
function setStatus(t,e=false){$('status').textContent=t;$('retry').classList.toggle('hidden',!e)}function cleanup(){if(hls){hls.destroy();hls=null}player.pause();player.removeAttribute('src');player.load()}function remember(c){recent=[c.id,...recent.filter(x=>x!==c.id)].slice(0,30);saveJSON('thub-recent',recent);updateUI()}function playChannel(c){current=c;retries=0;cleanup();$('nowName').textContent=c.name;setStatus('LOADING…');closeDrawer();startStream(c)}function startStream(c){if(!c)return;if(player.canPlayType('application/vnd.apple.mpegurl')){player.src=c.url;player.play().catch(()=>{})}else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:30,maxBufferLength:30,maxMaxBufferLength:60});hls.loadSource(c.url);hls.attachMedia(player);hls.on(Hls.Events.MANIFEST_PARSED,()=>player.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;if(retries<2&&d.type===Hls.ErrorTypes.NETWORK_ERROR){retries++;setTimeout(()=>{if(current===c){hls?.destroy();hls=null;startStream(c)}},1200*retries)}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&hls)hls.recoverMediaError();else setStatus('STREAM UNAVAILABLE',true)})}else setStatus('HLS NOT SUPPORTED',true)}player.addEventListener('playing',()=>{setStatus('');if(current){remember(current);tests[current.id]={status:'ok',time:Date.now()};saveJSON('thub-tests',tests);updateUI()}});player.addEventListener('waiting',()=>setStatus('BUFFERING…'));$('retry').onclick=()=>{if(current){cleanup();startStream(current)}};
async function testOne(c){if(location.protocol==='https:'&&c.url.startsWith('http:'))return'bad';const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),TEST_TIMEOUT);try{const r=await fetch(c.url,{method:'GET',mode:'cors',cache:'no-store',signal:ctrl.signal,headers:{Range:'bytes=0-2047'}});if(!r.ok)return'bad';const type=(r.headers.get('content-type')||'').toLowerCase();const text=await r.text();return(type.includes('mpegurl')||text.includes('#EXTM3U')||type.startsWith('video/')||type.includes('octet-stream'))?'ok':'bad'}catch{return'bad'}finally{clearTimeout(timer)}}
async function scanLoop(){if(scanRunning)return;scanRunning=true;scanStop=false;updateUI();while(!scanStop){if(!allChannels.length)break;if(current&&!player.paused&&!player.ended){await sleep(1500);continue}const batch=allChannels.filter(c=>!tests[c.id]).slice(0,2);if(!batch.length)break;const out=await Promise.all(batch.map(async c=>[c.id,await testOne(c)]));for(const[id,status]of out)tests[id]={status,time:Date.now()};saveJSON('thub-tests',tests);updateUI();if(mode==='working'||mode==='untested')applyFilters();await sleep(250)}scanRunning=false;updateUI()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}$('scanBtn').onclick=()=>{if(scanRunning){scanStop=true;$('scanBtn').textContent='PAUSING…'}else scanLoop()};$('clearScan').onclick=()=>{scanStop=true;scanRunning=false;tests={};localStorage.removeItem('thub-tests');updateUI();applyFilters()};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
