<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T.HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { height: 100%; margin: 0; background-color: #000; color: #fff; font-family: 'Courier New', monospace; }
        #menu-toggle { position: fixed; top: 20px; left: 20px; font-size: 2rem; cursor: pointer; border: 1px solid #fff; padding: 5px 15px; z-index: 1000; }
        #channel-list { position: fixed; top: 80px; left: 20px; width: 300px; height: calc(100vh - 100px); overflow-y: auto; display: none; background: #000; border: 1px solid #333; }
        .list-group-item { background: #000; color: #fff; border-color: #333; cursor: pointer; font-size: 0.8rem; }
        .list-group-item:hover { background: #222; }
        .center-container { display: flex; align-items: center; justify-content: center; height: 100vh; }
        video { width: 80%; max-width: 900px; background: #000; }
        .sort-btn { background: #333; color: white; border: 1px solid #555; padding: 5px; width: 50%; }
        #search-box { width: 100%; background: #000; color: #fff; border: 1px solid #555; padding: 5px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="login" class="center-container">
    <div>
        <input type="password" id="pass" placeholder="PASSWORD" class="form-control mb-2" style="background:#000; color:#fff; border:1px solid #333; text-align:center;">
        <button onclick="checkPass()" class="btn btn-outline-light w-100">ACCESS</button>
    </div>
</div>

<div id="app" style="display:none;">
    <div id="menu-toggle" onclick="toggleMenu()">+</div>
    
    <div id="channel-list" class="list-group">
        <input type="text" id="search-box" placeholder="Search channels..." onkeyup="filterChannels()">
        <div class="d-flex">
            <button class="sort-btn" onclick="sortList('country')">SORT COUNTRY</button>
            <button class="sort-btn" onclick="sortList('lang')">SORT LANG</button>
        </div>
        <div id="items"></div>
    </div>

    <div class="center-container">
        <video id="player" controls></video>
    </div>
</div>

<script>
    let allChannels = [];
    const player = document.getElementById('player');
    const hls = new Hls();

    function checkPass() {
        if (document.getElementById('pass').value === "L@buan.2026!") {
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            fetchAll();
        } else { alert("ACCESS DENIED"); }
    }

    async function fetchAll() {
        const url = 'https://iptv-org.github.io/iptv/index.m3u';
        const res = await fetch(url);
        const text = await res.text();
        const lines = text.split('\n');
        
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].startsWith('#EXTINF')) {
                const info = lines[i];
                allChannels.push({
                    name: info.split(',')[1],
                    url: lines[i+1],
                    country: info.match(/country-code="([^"]+)"/)?.[1] || 'zzz',
                    lang: info.match(/tvg-language="([^"]+)"/)?.[1] || 'zzz'
                });
            }
        }
        render(allChannels);
    }

    function render(list) {
        document.getElementById('items').innerHTML = list.map(c => 
            `<div class="list-group-item" onclick="play('${c.url}')">${c.name}</div>`
        ).join('');
    }

    function filterChannels() {
        const query = document.getElementById('search-box').value.toLowerCase();
        const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
        render(filtered);
    }

    function sortList(key) {
        allChannels.sort((a, b) => a[key].localeCompare(b[key]));
        render(allChannels);
    }

    function toggleMenu() {
        const list = document.getElementById('channel-list');
        list.style.display = (list.style.display === 'block') ? 'none' : 'block';
    }

    function play(url) {
        hls.loadSource(url);
        hls.attachMedia(player);
        player.play();
    }
</script>
</body>
</html>
